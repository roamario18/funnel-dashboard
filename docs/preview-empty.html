<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Воронка продаж — пустой период</title>
  <link rel="stylesheet" href="../public/styles.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <div>
        <h1>Воронка продаж</h1>
        <p class="muted">bs18.bitrix24.ru · oauth_app · READONLY</p>
      </div>
      <div class="filters">
        <label class="funnel"><span>Воронка</span>
          <select><option>Общая</option></select>
        </label>
        <div class="period">
          <button type="button" class="chip is-active">7 дней</button>
          <button type="button" class="chip">30 дней</button>
          <button type="button" class="chip">Все</button>
        </div>
      </div>
    </header>
    <section class="kpis">
      <article class="card kpi"><span>Сумма открытых</span><strong>0 ₽</strong></article>
      <article class="card kpi"><span>Выиграно за период</span><strong>0</strong></article>
      <article class="card kpi"><span>Средний чек</span><strong>0 ₽</strong></article>
    </section>
    <section class="card">
      <h2>Стадии воронки</h2>
      <p class="empty">Нет сделок за выбранный период.</p>
    </section>
    <section class="card">
      <h2>Последние сделки</h2>
      <p class="empty">Нет сделок за выбранный период.</p>
    </section>
  </div>
</body>
</html>
